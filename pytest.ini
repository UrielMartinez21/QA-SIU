[pytest]
# Configuracion de pytest para las pruebas E2E de QA.
# Los flags de evidencia se aplican en cada corrida para que, si un test falla,
# quede screenshot + video + trace en test-results/ automaticamente.
addopts =
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure

# Solo se recolectan tests dentro de la carpeta src/tests
testpaths = src/tests

# Convenciones de nombres (por si se quiere personalizar mas adelante)
python_files = test_*.py
python_functions = test_*
