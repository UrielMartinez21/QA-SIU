[pytest]
# Configuracion de pytest para las pruebas E2E de QA.
# Si un test falla, se conserva el trace (se mueve a reportes/<corrida>/ junto
# al .md). El screenshot lo toma siempre el hook de conftest.py (pase o falle),
# por eso el del plugin esta desactivado. El video tambien esta desactivado.
addopts =
    --screenshot=off
    --video=off
    --tracing=retain-on-failure

# Solo se recolectan tests dentro de la carpeta src/tests
testpaths = src/tests

# Convenciones de nombres (por si se quiere personalizar mas adelante)
python_files = test_*.py
python_functions = test_*
